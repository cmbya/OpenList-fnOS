name: Build OpenList fnOS FPK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选：指定 OpenList 版本，例如 v4.2.5；留空则使用上游最新正式版"
        required: false
        type: string

  schedule:
    # 每天一次：UTC 01:17 = 北京时间 09:17
    - cron: "17 1 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取目标版本
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_VERSION:-}" ]; then
            TAG="$MANUAL_VERSION"
            case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          else
            TAG="$(gh api repos/OpenListTeam/OpenList/releases/latest --jq '.tag_name')"
          fi
          VERSION="${TAG#v}"
          PACK_REV="$(tr -d '[:space:]' < PACK_REV)"
          RELEASE_TAG="fnos-${TAG}-${PACK_REV}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pack_rev=$PACK_REV" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "OpenList 上游: $TAG"
          echo "fnOS 封装: $PACK_REV"

      - name: 检查是否已经发布
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG 已存在，跳过重复构建。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 验证上游正式 Release 和 amd64 资源
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          IS_DRAFT="$(gh api "repos/OpenListTeam/OpenList/releases/tags/$TAG" --jq '.draft')"
          IS_PRE="$(gh api "repos/OpenListTeam/OpenList/releases/tags/$TAG" --jq '.prerelease')"
          [ "$IS_DRAFT" = "false" ] && [ "$IS_PRE" = "false" ] || {
            echo "目标 $TAG 不是正式 Release" >&2
            exit 1
          }
          gh api "repos/OpenListTeam/OpenList/releases/tags/$TAG" \
            --jq '.assets[].name' | grep -Fx 'openlist-linux-amd64.tar.gz'
          echo "已确认上游存在 openlist-linux-amd64.tar.gz"

      - name: 构建 x86 FPK
        if: steps.existing.outputs.exists != 'true'
        run: |
          chmod +x ./scripts/build_fpk.sh
          ./scripts/build_fpk.sh "${{ steps.version.outputs.tag }}"

      - name: 上传 Actions 构建产物
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenList-${{ steps.version.outputs.version }}-${{ steps.version.outputs.pack_rev }}-fnOS-x86
          path: |
            dist/*.fpk
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: 创建 GitHub Pre-release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          UPSTREAM_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PACK_REV: ${{ steps.version.outputs.pack_rev }}
        run: |
          cat > /tmp/release-notes.md <<EOF2
          根据 OpenList 上游正式 Release **${UPSTREAM_TAG}** 自动生成 fnOS x86 原生 FPK。

          - 上游版本：${UPSTREAM_TAG}
          - fnOS 封装：${PACK_REV}
          - 架构：x86 / amd64
          - Web 端口：5244
          - Docker：不使用
          - 数据：升级保留 OpenList data 数据库和配置
          - 上游二进制：openlist-linux-amd64.tar.gz

          这是自动构建的 **Pre-release**。建议先在飞牛上覆盖升级测试，确认正常后再手动改为正式 Release。
          EOF2

          gh release create "$RELEASE_TAG" \
            dist/*.fpk dist/SHA256SUMS.txt \
            --title "OpenList ${VERSION} fnOS x86 (${PACK_REV})" \
            --notes-file /tmp/release-notes.md \
            --prerelease
